<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- =================================================================
     NOVA AI – onboarding experiment
     * Texts are NOT written here: they come from content.json
       (data-t="screen.key" → screens.screen.key in content.json).
     * Each <section class="screen"> is one screen, shown in the order
       of this file. Delete a section to drop a screen.
     * Must be opened through serve.py (http://localhost:8000), because
       browsers don't load JSON from a double-clicked file.
     ================================================================= -->

<!-- Reusable logo -->
<template id="logo-tpl">
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="6" fill="currentColor"/>
      <ellipse cx="16" cy="16" rx="14" ry="6" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-30 16 16)"/>
    </svg>
    <span class="logo-name" data-brand></span>
  </div>
</template>

<!-- ======================= STUDY FRAME: intro ======================= -->
<section class="screen study" data-screen="study_intro">
  <form class="study-card" novalidate>
    <h1 data-t="study_intro.title"></h1>
    <div class="study-body" data-t="study_intro.body"></div>
    <label class="checkrow">
      <input type="checkbox" name="study_consent" required>
      <span data-t="study_intro.consent"></span>
    </label>
    <p class="field-error" data-error="study_consent" hidden>Please confirm to continue.</p>
    <button type="submit" class="btn btn-dark btn-block" data-t="study_intro.button"></button>
  </form>
</section>

<!-- ======================= 1 · Sign in ======================= -->
<section class="screen layout-hero" data-screen="signin">
  <div class="logo-slot logo-left"></div>
  <div class="hero">
    <h1 class="display-xl" data-t="signin.title"></h1>
    <p class="hero-sub" data-t="signin.subtitle"></p>
    <form class="panel" novalidate>
      <input class="input" type="email" name="_email" autocomplete="off" data-ph="signin.email_placeholder" required>
      <button type="submit" class="btn btn-dark btn-block" data-t="signin.button"></button>
      <p class="legal" data-t="signin.legal"></p>
    </form>
  </div>
</section>

<!-- ======================= 2 · Verify email ======================= -->
<section class="screen layout-hero" data-screen="verify">
  <div class="logo-slot logo-left"></div>
  <div class="hero">
    <h1 class="display-xl" data-t="signin.title"></h1>
    <p class="hero-sub" data-t="signin.subtitle"></p>
    <form class="panel panel-center" novalidate>
      <p data-t="verify.code_hint"></p>
      <input class="input input-center" type="text" name="_code" autocomplete="off" inputmode="numeric" data-ph="verify.code_placeholder" required>
      <p class="field-error field-error-center" data-error="_code" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11" r=".9" fill="currentColor"/></svg>
        <span data-t="verify.code_error"></span>
      </p>
      <button type="submit" class="btn btn-dark btn-block" data-t="verify.button"></button>
      <p class="mt-lg" data-t="verify.help"></p>
    </form>
  </div>
</section>

<!-- ======================= 3 · Terms ======================= -->
<section class="screen layout-center" data-screen="terms">
  <div class="logo-slot logo-top"></div>
  <div class="center-block">
    <h1 class="display-l" data-t="terms.title"></h1>
    <p class="sub" data-t="terms.subtitle"></p>
    <form class="panel panel-tight" novalidate>
      <label class="checkrow">
        <input type="checkbox" name="_terms" required>
        <span data-t="terms.terms_label"></span>
      </label>
      <p class="field-error" data-error="_terms" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M8 4.5v4.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="11" r=".9" fill="currentColor"/></svg>
        <span data-t="terms.terms_error"></span>
      </p>
      <label class="checkrow">
        <input type="checkbox" name="promo_emails" value="yes">
        <span data-t="terms.promo_label"></span>
      </label>
      <button type="submit" class="btn btn-dark btn-block" data-t="terms.button"></button>
    </form>
  </div>
  <div class="verified-footer">
    Email verified as <span data-var="email"></span><br>
    <a href="#" data-action="goto" data-target="signin">Use a different email</a>
  </div>
</section>

<!-- ======================= 4 · Birthday ======================= -->
<section class="screen layout-center" data-screen="birthday">
  <div class="logo-slot logo-top"></div>
  <div class="center-block narrow">
    <h1 class="display-l" data-t="birthday.title"></h1>
    <p class="sub" data-t="birthday.subtitle"></p>
    <form class="stack" novalidate>
      <input class="input" type="text" name="_birthday" inputmode="numeric" maxlength="10"
             pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/(19|20)[0-9]{2}" data-ph="birthday.placeholder" required>
      <button type="submit" class="btn btn-dark btn-block" data-t="birthday.button"></button>
    </form>
  </div>
  <div class="verified-footer">
    Email verified as <span data-var="email"></span><br>
    <a href="#" data-action="goto" data-target="signin">Use a different email</a>
  </div>
</section>

<!-- ======================= 5 · Name ======================= -->
<section class="screen layout-center" data-screen="name">
  <div class="logo-slot logo-top"></div>
  <div class="center-block narrow">
    <h1 class="display-m" data-t="name.title"></h1>
    <p class="sub" data-t="name.subtitle"></p>
    <form class="stack" novalidate>
      <input class="input input-white input-center input-tall" type="text" name="_name" autocomplete="off" data-ph="name.placeholder" required>
      <button type="submit" class="btn btn-dark btn-block" data-t="name.button" data-enable-when="_name" disabled></button>
    </form>
  </div>
</section>

<!-- ======================= 6 · Role ======================= -->
<section class="screen layout-center" data-screen="role">
  <div class="logo-slot logo-top"></div>
  <div class="center-block narrow">
    <h1 class="display-m" data-t="role.title"></h1>
    <p class="sub" data-t="role.subtitle"></p>
    <form class="stack" novalidate>
      <div class="select-wrap">
        <select class="input" name="role" id="role-select"></select>
      </div>
      <button type="submit" class="btn btn-dark btn-block" data-t="role.button" data-show-when="role" hidden></button>
      <button type="button" class="btn-text" data-action="skip" data-record="role=skipped" data-t="role.skip"></button>
    </form>
  </div>
</section>

<!-- ======================= 7 · Usage ======================= -->
<section class="screen layout-top" data-screen="usage">
  <div class="logo-slot logo-top"></div>
  <h1 class="display-s" data-t="usage.title"></h1>
  <div class="choice-cards">
    <button type="button" class="choice-card" data-action="skip" data-record="usage=personal">
      <svg class="illu" viewBox="0 0 80 80" aria-hidden="true">
        <path d="M18 38h12v26H18z M30 40c6-4 10-12 11-22 1-5 8-4 8 2 0 6-2 11-3 14h14c4 0 6 4 4 7 3 1 3 6 0 7 2 2 1 6-2 7 1 3-1 6-4 6H34c-2 0-4-1-4-2" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span class="choice-title" data-t="usage.personal_title"></span>
      <span class="choice-text" data-t="usage.personal_text"></span>
    </button>
    <button type="button" class="choice-card" data-action="skip" data-record="usage=team">
      <svg class="illu" viewBox="0 0 80 80" aria-hidden="true">
        <path d="M8 34l14-10 14 6 8-4 16 10 10-6 6 10-12 8" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M30 32l-8 8c-2 2 0 5 3 4l9-6 10 9c2 2 5-1 3-3m-6-4l9 8c2 2 5-1 3-3l-8-7m-1 11l4 4c2 2 5-1 3-3M58 42L44 30" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M8 34l10 14 6-4" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span class="choice-title" data-t="usage.team_title"></span>
      <span class="choice-text" data-t="usage.team_text"></span>
    </button>
  </div>
</section>

<!-- ======================= 8 · Plans ======================= -->
<section class="screen layout-top" data-screen="plans">
  <div class="logo-slot logo-top"></div>
  <h1 class="display-s" data-t="plans.title"></h1>
  <div class="plan-list">
    <div class="plan-card">
      <div class="plan-head">
        <svg class="plan-icon" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="11" r="6" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
          <circle cx="24" cy="11" r="2.2" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
          <path d="M24 17v27M24 30l-9-5M24 30l9-5" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="13" cy="24" r="3" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
          <circle cx="35" cy="24" r="3" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
        </svg>
        <div class="plan-name" data-t="plans.free_name"></div>
        <div class="plan-tagline" data-t="plans.free_tagline"></div>
        <div class="plan-price" data-t="plans.free_price"></div>
        <button type="button" class="btn btn-dark btn-block" data-action="skip" data-record="plan=free" data-t="plans.free_button"></button>
      </div>
      <ul class="plan-features" data-list="plans.free_features"></ul>
    </div>

    <div class="plan-card plan-card-tinted">
      <div class="plan-head">
        <div class="plan-head-row">
          <svg class="plan-icon" viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="9" r="5.5" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
            <circle cx="24" cy="9" r="2" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            <path d="M24 14.5V46M24 26l-10-5M24 26l10-5M24 36l-10-5M24 36l10-5" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="20" r="2.8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            <circle cx="36" cy="20" r="2.8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            <circle cx="12" cy="30" r="2.8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
            <circle cx="36" cy="30" r="2.8" fill="none" stroke="#1a1a1a" stroke-width="1.6"/>
          </svg>
          <div class="billing-toggle" role="group">
            <button type="button" data-billing="monthly" data-t="plans.monthly"></button>
            <button type="button" data-billing="yearly" class="is-on"><span data-t="plans.yearly"></span> · <span class="save" data-t="plans.yearly_badge"></span></button>
          </div>
        </div>
        <div class="plan-name" data-t="plans.pro_name"></div>
        <div class="plan-tagline" data-t="plans.pro_tagline"></div>
        <div class="plan-price">
          <span id="pro-price"></span>
          <span class="plan-price-suffix"><span data-t="plans.pro_price_suffix"></span><br><span id="pro-billing"></span></span>
        </div>
        <button type="button" class="btn btn-dark btn-block" data-action="skip" data-record="plan=pro" data-t="plans.pro_button"></button>
      </div>
      <p class="plan-features-intro" data-t="plans.pro_features_intro"></p>
      <ul class="plan-features" data-list="plans.pro_features"></ul>
    </div>
  </div>
</section>

<!-- ======================= 9 · Desktop app ======================= -->
<section class="screen layout-top" data-screen="desktop">
  <div class="logo-slot logo-top"></div>
  <h1 class="display-s wide" data-t="desktop.title"></h1>
  <p class="sub sub-wide" data-t="desktop.subtitle"></p>
  <div class="dock-stage" aria-hidden="true">
    <div class="dock">
      <span class="dock-app app-a"><svg viewBox="0 0 40 40"><path d="M8 14h10l3 3h11v15H8z" fill="#fff" opacity=".95"/></svg></span>
      <span class="dock-app app-b"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="11" fill="none" stroke="#fff" stroke-width="3"/><path d="M20 12v8l6 4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg></span>
      <span class="dock-app app-nova">
        <span class="dock-tip" data-t="desktop.tooltip"></span>
        <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="5" fill="#fff"/><ellipse cx="16" cy="16" rx="12" ry="5" fill="none" stroke="#fff" stroke-width="2" transform="rotate(-30 16 16)"/></svg>
        <svg class="cursor" viewBox="0 0 24 24"><path d="M5 2l14 11h-7l4 8-3 1.5-4-8L5 19z" fill="#fff" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round"/></svg>
        <span class="dock-dot"></span>
      </span>
      <span class="dock-app app-c"><svg viewBox="0 0 40 40"><rect x="9" y="11" width="22" height="18" rx="3" fill="#fff"/><path d="M11 26l6-7 5 5 3-3 4 5" fill="none" stroke="#6aa9d8" stroke-width="2.4" stroke-linejoin="round"/></svg></span>
    </div>
  </div>
  <div class="center-actions">
    <button type="button" class="btn btn-dark btn-wide" data-action="skip" data-record="desktop=download" data-t="desktop.button"></button>
    <button type="button" class="btn-text" data-action="skip" data-record="desktop=skip" data-t="desktop.skip"></button>
  </div>
</section>

<!-- ============ 10 · TREATMENT – Before your first chat ============ -->
<section class="screen layout-center" data-screen="treatment">
  <div class="logo-slot logo-top"></div>
  <div class="center-block wide">
    <h1 class="display-l" data-t="treatment.title"></h1>
    <p class="sub" data-t="treatment.subtitle"></p>
    <form novalidate>
      <div class="panel panel-rows">
        <div class="info-row">
          <span class="row-icon icon-lilac">
            <svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="#1a1a1a" stroke-width="1.5"/><path d="M4 4l16 16" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <p data-t="treatment.row1"></p>
        </div>
        <div class="info-row">
          <span class="row-icon icon-sage">
            <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <p data-t="treatment.row2"></p>
        </div>
        <!-- The data-use setting (switch or active choice) is inserted here by app.js -->
        <div class="info-row" id="treatment-row"></div>
        <div class="learn-more-box" id="learn-more-box" data-t="treatment.learn_more_text" hidden></div>
      </div>
      <p class="field-error field-error-center" data-error="_choice" hidden>Please make a choice to continue.</p>
      <button type="submit" class="btn btn-dark btn-block btn-after-panel" data-t="treatment.button"></button>
    </form>
  </div>
</section>

<!-- ======================= 11 · All set ======================= -->
<section class="screen layout-center plain" data-screen="all_set">
  <div class="center-block narrow">
    <svg class="check-badge" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#0d0d0d"/><path d="M8.5 14.5l3.6 3.5 7.4-7.6" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1 class="title-sans" data-t="all_set.title"></h1>
    <p class="sub sub-wide" data-t="all_set.body"></p>
    <form novalidate>
      <button type="submit" class="btn btn-dark btn-pill btn-block" data-t="all_set.button"></button>
    </form>
    <p class="legal" data-t="all_set.legal"></p>
  </div>
</section>

<!-- ======================= STUDY FRAME: questionnaire ======================= -->
<section class="screen study" data-screen="questionnaire">
  <form class="study-card" novalidate>
    <h1 data-t="questionnaire.title"></h1>
    <p class="study-body" data-t="questionnaire.intro"></p>
    <div id="questionnaire-items"></div>
    <button type="submit" class="btn btn-dark btn-block" data-t="questionnaire.button"></button>
  </form>
</section>

<!-- ======================= STUDY FRAME: debrief ======================= -->
<section class="screen study" data-screen="debrief">
  <div class="study-card">
    <h1 data-t="debrief.title"></h1>
    <div class="study-body" data-t="debrief.body"></div>
    <div id="debug-output"></div>
  </div>
</section>

<!-- Pop-up with the verification code (opens when the verify screen is shown) -->
<div class="modal-backdrop" id="code-modal" hidden>
  <div class="modal" role="dialog" aria-modal="false" aria-labelledby="code-modal-title">
    <h2 class="modal-title" id="code-modal-title" data-t="verify.popup_title"></h2>
    <p class="modal-text" data-t="verify.popup_text"></p>
    <p class="code-display" id="code-value"></p>
    <button type="button" class="btn btn-dark btn-block" data-action="close-code" data-t="verify.popup_button"></button>
  </div>
</div>

<div class="debug-bar" id="debug-bar" hidden></div>
<script src="js/app.js"></script>
</body>
</html>
